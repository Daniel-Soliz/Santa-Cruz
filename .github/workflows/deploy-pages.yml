name: Publicar catálogo e pedidos no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # O GitHub Pages configurado por branch também publica automaticamente.
  # Esta segunda execução restaura o build Vite depois do deploy por branch.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run lint
      - name: Testar regras e pedido WhatsApp
        run: npm run test:pedido
      - name: Compilar para /Santa-Cruz/
        run: npm run build:pages
        env:
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
      - name: Verificar arquivos da publicação
        run: npm run test:pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Aguardar publicação concorrente do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Se o Pages ainda publica a branch diretamente, o build fonte pode
          # sobrescrever os assets do Vite. Garantimos que ele termine primeiro.
          for attempt in $(seq 1 36); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.name=="pages build and deployment" and .head_sha==$sha)] | .[0].status // "completed"')
            if [ "$state" = "completed" ]; then
              echo "Publicação por branch concluída ou inexistente."
              break
            fi
            echo "Aguardando publicação por branch (tentativa $attempt)..."
            sleep 5
          done
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
